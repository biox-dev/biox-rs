name: Release

# 当推送 v* 形式的 tag 时触发，例如：v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux binary
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          cargo build --release --bin biox
          mkdir -p release
          cp target/release/biox "release/biox-${TAG}-linux-amd64"

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/biox-${{ github.ref_name }}-linux-amd64
